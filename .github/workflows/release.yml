name: Build & Release Voice Bubble APK

on:
  push:
    branches:
      - 'release/v*'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Stable release version tag (for example, v1.2.3)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag_name: ${{ steps.version.outputs.TAG_NAME }}
      version_name: ${{ steps.version.outputs.VERSION_NAME }}
    steps:
      - name: Checkout source without a persisted token
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, actions/checkout tag ref via GitHub API
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4, actions/setup-java tag ref via GitHub API
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4, android-actions/setup-android tag ref via GitHub API
        with:
          packages: 'platforms;android-36 build-tools;35.0.0'

      - name: Run release policy regression tests
        run: |
          set -euo pipefail
          bash scripts/test-release-version.sh
          bash scripts/test-release-security.sh

      - name: Validate release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION_TAG: ${{ github.event.inputs.version_tag }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_dispatch)
              if [[ "$RELEASE_REF" != 'refs/heads/main' ]]; then
                echo '::error::Manual release builds must be dispatched from main.'
                exit 1
              fi
              RAW_TAG="$INPUT_VERSION_TAG"
              ;;
            push)
              if [[ "$RELEASE_REF" == refs/tags/* ]]; then
                RAW_TAG="${RELEASE_REF#refs/tags/}"
              elif [[ "$RELEASE_REF" == refs/heads/release/v* ]]; then
                RAW_TAG="${RELEASE_REF#refs/heads/release/}"
              else
                echo '::error::Unsupported release build ref.'
                exit 1
              fi
              ;;
            *)
              echo '::error::Unsupported release build event.'
              exit 1
              ;;
          esac
          VERSION_OUTPUT="$(bash scripts/validate-release-version.sh "$RAW_TAG")" || {
            echo '::error::Release version is invalid; expected stable vMAJOR.MINOR.PATCH within Android version-code limits.'
            exit 1
          }
          printf '%s\n' "$VERSION_OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        env:
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
        run: |
          ./gradlew testDebugUnitTest "-PversionName=$VERSION_NAME" --no-daemon --stacktrace
          ./gradlew testReleaseUnitTest --tests '*GeminiSafeLoggingTest' "-PversionName=$VERSION_NAME" --no-daemon --stacktrace

      - name: Build unsigned release APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
        run: ./gradlew assembleRelease "-PversionName=$VERSION_NAME" -PunsignedRelease=true --no-daemon --stacktrace

      - name: Confirm release APK is unsigned
        run: |
          set -euo pipefail
          unsigned_apk='app/build/outputs/apk/release/app-release-unsigned.apk'
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          [[ -f "$unsigned_apk" ]] || {
            echo '::error::Expected unsigned release APK was not produced.'
            exit 1
          }
          [[ -x "$apksigner" ]] || {
            echo '::error::Pinned Android apksigner 35.0.0 was not found.'
            exit 1
          }
          if "$apksigner" verify "$unsigned_apk" >/dev/null 2>&1; then
            echo '::error::Build artifact unexpectedly contains an APK signature.'
            exit 1
          fi

      - name: Upload unsigned APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, actions/upload-artifact tag ref via GitHub API
        with:
          name: unsigned-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 3

  sign-release:
    needs: build-and-test
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      vars.RELEASE_SIGNING_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: release-signing
    permissions:
      actions: read
      contents: read
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4, actions/setup-java tag ref via GitHub API
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Android SDK tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4, android-actions/setup-android tag ref via GitHub API
        with:
          packages: 'build-tools;35.0.0'

      - name: Download unsigned APK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4, actions/download-artifact tag ref via GitHub API
        with:
          name: unsigned-release-apk
          path: ${{ runner.temp }}/unsigned-apk

      - name: Verify unsigned artifact and fetch previous published APK
        id: previous
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          unsigned_apk="$RUNNER_TEMP/unsigned-apk/app-release-unsigned.apk"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          [[ -f "$unsigned_apk" ]] || {
            echo '::error::Unsigned APK artifact is missing.'
            exit 1
          }
          [[ -x "$apksigner" ]] || {
            echo '::error::Pinned Android apksigner 35.0.0 was not found.'
            exit 1
          }
          if "$apksigner" verify "$unsigned_apk" >/dev/null 2>&1; then
            echo '::error::Downloaded build artifact was not unsigned.'
            exit 1
          fi

          latest_json="$RUNNER_TEMP/latest-release.json"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            -H 'Accept: application/vnd.github+json' \
            -H 'User-Agent: NIRZOR-Voice-Typing-release-workflow' \
            "https://api.github.com/repos/$RELEASE_REPOSITORY/releases/latest" \
            --output "$latest_json"
          previous_tag="$(jq -er '.tag_name | strings' "$latest_json")"
          if [[ ! "$previous_tag" =~ ^v(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$ ]]; then
            echo '::error::Latest published release tag is missing or not a stable version; refusing to sign.'
            exit 1
          fi
          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          patch=$((10#${BASH_REMATCH[3]}))
          if (( major > 210000 || major * 10000 + minor * 100 + patch > 2100000000 )); then
            echo '::error::Latest published release tag exceeds Android version-code limits.'
            exit 1
          fi

          previous_apk="$RUNNER_TEMP/previous-release.apk"
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 \
            -H 'User-Agent: NIRZOR-Voice-Typing-release-workflow' \
            "https://github.com/$RELEASE_REPOSITORY/releases/download/$previous_tag/voicebubble.apk" \
            --output "$previous_apk"
          verify_output="$("$apksigner" verify --print-certs "$previous_apk" 2>&1)" || {
            echo '::error::Could not verify the latest published APK signature.'
            printf '%s\n' "$verify_output" >&2
            exit 1
          }
          previous_cert="$(printf '%s\n' "$verify_output" | awk '/certificate SHA-256 digest:/ { print $NF; exit }' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$previous_cert" =~ ^[0-9a-f]{64}$ ]]; then
            echo '::error::Latest published APK did not provide a valid SHA-256 signing-certificate fingerprint.'
            exit 1
          fi
          printf 'PREVIOUS_TAG=%s\nPREVIOUS_CERT=%s\n' "$previous_tag" "$previous_cert" >> "$GITHUB_OUTPUT"

      - name: Sign and enforce signing-certificate continuity
        env:
          TAG_NAME: ${{ needs.build-and-test.outputs.tag_name }}
          PREVIOUS_TAG: ${{ steps.previous.outputs.PREVIOUS_TAG }}
          PREVIOUS_CERT: ${{ steps.previous.outputs.PREVIOUS_CERT }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          key_dir="$(mktemp -d "$RUNNER_TEMP/release-keystore.XXXXXX")"
          cleanup_key() { rm -rf -- "$key_dir"; }
          trap cleanup_key EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM

          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo '::error::Signing is enabled but required environment-scoped signing secrets are missing.'
            exit 1
          fi
          if [[ ! "$TAG_NAME" =~ ^v(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$ ]]; then
            echo '::error::Requested release tag is not a stable version.'
            exit 1
          fi
          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          patch=$((10#${BASH_REMATCH[3]}))
          if (( major > 210000 || major * 10000 + minor * 100 + patch > 2100000000 )); then
            echo '::error::Requested release tag exceeds Android version-code limits.'
            exit 1
          fi
          if [[ ! "$PREVIOUS_CERT" =~ ^[0-9a-f]{64}$ || ! "$PREVIOUS_TAG" =~ ^v(0|[1-9][0-9]{0,5})\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$ ]]; then
            echo '::error::Previous release signing identity is unavailable or invalid; refusing to sign.'
            exit 1
          fi

          keystore_path="$key_dir/release.keystore"
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"; then
            echo '::error::Could not decode signing keystore.'
            exit 1
          fi
          [[ -s "$keystore_path" ]] || {
            echo '::error::Decoded signing keystore is empty.'
            exit 1
          }

          unsigned_apk="$RUNNER_TEMP/unsigned-apk/app-release-unsigned.apk"
          signed_apk="$RUNNER_TEMP/voicebubble-signed.apk"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$apksigner" sign \
            --ks "$keystore_path" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$signed_apk" \
            "$unsigned_apk"

          sign_output="$("$apksigner" verify --print-certs "$signed_apk" 2>&1)" || {
            echo '::error::The newly signed APK failed signature verification.'
            printf '%s\n' "$sign_output" >&2
            exit 1
          }
          new_cert="$(printf '%s\n' "$sign_output" | awk '/certificate SHA-256 digest:/ { print $NF; exit }' | tr '[:upper:]' '[:lower:]')"
          if [[ ! "$new_cert" =~ ^[0-9a-f]{64}$ ]]; then
            echo '::error::New APK did not provide a valid SHA-256 signing-certificate fingerprint.'
            exit 1
          fi
          if [[ "$new_cert" != "$PREVIOUS_CERT" ]]; then
            echo "::error::New APK signing certificate does not match the latest published APK ($PREVIOUS_TAG); refusing to sign or publish."
            exit 1
          fi

          artifact_dir="$RUNNER_TEMP/signed-release-artifacts"
          mkdir -m 700 "$artifact_dir"
          cp -- "$signed_apk" "$artifact_dir/voicebubble.apk"
          (cd "$artifact_dir" && sha256sum voicebubble.apk | awk '{print $1}' > voicebubble.apk.sha256)

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4, actions/upload-artifact tag ref via GitHub API
        with:
          name: signed-release-artifacts
          path: ${{ runner.temp }}/signed-release-artifacts/*
          if-no-files-found: error
          retention-days: 3

  publish-release:
    needs: [build-and-test, sign-release]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      vars.RELEASE_SIGNING_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download signed release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4, actions/download-artifact tag ref via GitHub API
        with:
          name: signed-release-artifacts
          path: release-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2, softprops/action-gh-release tag ref via GitHub API
        with:
          files: |
            release-artifacts/voicebubble.apk
            release-artifacts/voicebubble.apk.sha256
          name: Release ${{ needs.build-and-test.outputs.tag_name }}
          tag_name: ${{ needs.build-and-test.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
