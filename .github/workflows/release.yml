name: Build & Release Voice Bubble APK

on:
  push:
    branches:
      - 'release/v*' # versioned release branch pushes
    tags:
      - 'v*' # tagged releases
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Version Tag (e.g., v1.0.1)'
        required: false
        default: 'v1.0.0'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test --stacktrace

      - name: Extract Version Tag
        id: get_version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION_TAG: ${{ github.event.inputs.version_tag }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            workflow_dispatch)
              if [[ -z "$INPUT_VERSION_TAG" ]]; then
                echo "::error::A release version tag is required for manual releases."
                exit 1
              fi
              RAW_TAG="$INPUT_VERSION_TAG"
              ;;
            *)
              if [[ "$RELEASE_REF" == refs/tags/* ]]; then
                RAW_TAG="${RELEASE_REF#refs/tags/}"
              elif [[ "$RELEASE_REF" == refs/heads/release/v* ]]; then
                RAW_TAG="${RELEASE_REF#refs/heads/release/}"
              else
                echo "::error::Unable to determine release tag from the triggering ref."
                exit 1
              fi
              ;;
          esac
          VERSION_OUTPUT=$("$GITHUB_WORKSPACE/scripts/validate-release-version.sh" "$RAW_TAG") || {
            echo "::error::Release version is invalid; expected a stable vMAJOR.MINOR.PATCH within Android version-code limits."
            exit 1
          }
          printf '%s\n' "$VERSION_OUTPUT" >> "$GITHUB_ENV"

      - name: Validate Stable Signing Key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Configure the four stable signing secrets before building or publishing an APK."
            exit 1
          fi
          echo "Stable signing secrets are configured."

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
            echo "Keystore decoded successfully."
          else
            echo "No production keystore secret found, fallback to debug signing."
          fi

      - name: Build Release APK
        run: |
          ./gradlew assembleRelease "-PversionName=$VERSION_NAME" --stacktrace

      - name: Verify update signing compatibility
        run: |
          set -euo pipefail
          APK_FILE=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -iname '*unsigned*' | sort | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "::error::A signed Release APK was not produced."
            find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print || true
            exit 1
          fi
          echo "Checking signed APK: $APK_FILE"

          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"

          # Prefer the SDK tool already on PATH; otherwise resolve it only under the
          # SDK root supplied by the runner. Avoid scanning the entire filesystem or
          # relying on hard-coded hosted-runner directories.
          APKSIGNER="$(command -v apksigner 2>/dev/null || true)"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "$APKSIGNER" ] && [ -n "$SDK_ROOT" ] && [ -d "$SDK_ROOT/build-tools" ]; then
            APKSIGNER="$(find "$SDK_ROOT/build-tools" -mindepth 2 -maxdepth 2 \
              -type f -name apksigner -print 2>/dev/null | sort -V | tail -n 1)"
          fi

          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "::error::Android apksigner was not found on PATH or under the configured Android SDK build-tools directory."
            echo "::error::Refusing to publish an APK without signature verification."
            exit 1
          fi
          echo "Using apksigner: $APKSIGNER"

          cert_digest() {
            local APK_PATH="$1"
            local VERIFY_OUTPUT
            VERIFY_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK_PATH" 2>&1) || {
              echo "::error::apksigner could not verify $APK_PATH" >&2
              printf '%s\n' "$VERIFY_OUTPUT" >&2
              return 1
            }
            printf '%s\n' "$VERIFY_OUTPUT" |
              awk '/certificate SHA-256 digest:/ { print $NF; exit }'
          }

          NEW_CERT=$(cert_digest "$APK_FILE") || {
            echo "::error::Could not verify the new APK signature."
            exit 1
          }
          if [ -z "$NEW_CERT" ]; then
            echo "::error::apksigner output did not contain a SHA-256 certificate digest for the new APK."
            "$APKSIGNER" verify --print-certs "$APK_FILE" 2>&1 || true
            exit 1
          fi
          echo "New APK signing certificate SHA-256: $NEW_CERT"

          if [ "$TAG_NAME" = "v1.0.3" ]; then
            echo "::warning::v1.0.3 uses the new stable signing key. This one-time transition requires uninstalling the older app before installing v1.0.3."
            echo "Initial signing-key transition approved for v1.0.3; signature validity was verified above."
          else
            PREVIOUS_TAG=$(curl --fail --location --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: VoiceBubble-Release-Workflow" \
              "https://api.github.com/repos/engrnirzorme02/NIRZOR-Voice-Typing-floating/releases/latest" |
              jq -r '.tag_name // empty')
            if [ -z "$PREVIOUS_TAG" ]; then
              echo "::error::Could not determine the latest published release for signature comparison."
              exit 1
            fi

            OLD_APK="$RUNNER_TEMP/$PREVIOUS_TAG.apk"
            curl --fail --location --silent --show-error \
              "https://github.com/engrnirzorme02/NIRZOR-Voice-Typing-floating/releases/download/$PREVIOUS_TAG/voicebubble.apk" \
              --output "$OLD_APK"
            OLD_CERT=$(cert_digest "$OLD_APK")
            if [ -z "$OLD_CERT" ]; then
              echo "::error::Could not read signing certificate from release $PREVIOUS_TAG."
              exit 1
            fi

            echo "$PREVIOUS_TAG APK signing certificate SHA-256: $OLD_CERT"
            if [ "$NEW_CERT" != "$OLD_CERT" ]; then
              echo "::error::The new APK does not match the latest release signing certificate ($PREVIOUS_TAG). No release will be published."
              exit 1
            fi
            echo "Signing certificate matches the latest published release ($PREVIOUS_TAG)."
          fi

      - name: Prepare Release Assets
        run: |
          mkdir -p release-artifacts
          APK_FILE=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -iname '*unsigned*' | sort | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Signed Release APK not found!"
            find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print || true
            exit 1
          fi
          cp "$APK_FILE" release-artifacts/voicebubble.apk
          
          cd release-artifacts
          sha256sum voicebubble.apk | awk '{print $1}' > voicebubble.apk.sha256
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/heads/release/v') || github.event_name == 'workflow_dispatch'
        with:
          files: |
            release-artifacts/voicebubble.apk
            release-artifacts/voicebubble.apk.sha256
          name: Release ${{ env.TAG_NAME }}
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
